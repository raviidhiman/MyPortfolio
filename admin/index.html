<style>

  h('label',{class:'chk'},pub,'Visible on the website'),h('div',{style:'margin-top:12px;display:flex;gap:8px'},save,h('button',{class:'btn',onclick:done},'Cancel')),box)}

 s.items.forEach((it,i)=>m.append(h('div',{class:'row'+(it.published?'':' dim')},h('div',{class:'g'},h('b',null,it.title),h('small',null,(it.body||'').slice(0,90)+(it.published?'':' · hidden'))),

/* ---------- site settings ---------- */
async function viewSite(m){const S=await api('GET','/settings'),box=h('div'),g=(o,k)=>h('input',{value:o[k]||''});
 const st=g(S.site,'title'),sd=h('textarea',null,S.site.description||''),tag=g(S.hero,'tag'),nm=g(S.hero,'name'),ph=h('textarea',null,(S.hero.phrases||[]).join('\n')),ld=h('textarea',null,S.hero.lead||''),cta=g(S.hero,'cta'),rows=h('div');

/* ---------- messages + chat ---------- */
const when=d=>new Date(d).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
async function viewMessages(m){if(selMsg)return msgDetail(m,selMsg);

  ...list.map(x=>h('div',{class:'row'+(x.is_read?'':' new'),style:'cursor:pointer',onclick:()=>{selMsg=x.id;render()}},

    h('small',null,x.email+' · '+when(x.created_at)),h('small',null,x.message.length>110?x.message.slice(0,110)+'…':x.message)),
   h('button',{class:'btn sm'},'Open'))))}
async function msgDetail(m,id){

  h('div',{class:'card'},h('small',{style:'color:var(--m)'},x.email+' · '+when(x.created_at)),h('p',{class:'msgtext'},x.message),

function chatPanel(m,cid){

  sendB=h('button',{class:'btn pri'},'Send'),closeB=h('button',{class:'btn del sm'},'Close chat'),status=h('span',{class:'pill'}),comp=h('div',{class:'composer'},inp,sendB),box=h('div',{role:'status'});

  if(c.posts.length){const near=log.scrollHeight-log.scrollTop-log.clientHeight<80||!last;c.posts.forEach(p=>{log.append(h('div',{class:'bub '+p.sender},p.body,h('small',null,(p.sender==='admin'?'You':'Visitor')+' · '+when(p.created_at))));last=Math.max(last,p.id)});if(near)log.scrollTop=log.scrollHeight}};
 const post=async()=>{const b=inp.value.trim();if(!b)return;sendB.disabled=true;try{await api('POST','/chats/'+cid+'/post',{body:b});inp.value='';await pull()}catch(e){note(box,e.message)}sendB.disabled=false;inp.focus()};
 sendB.onclick=post;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();post()}});
 closeB.onclick=async()=>{if(!confirm('Close this chat? The visitor will no longer be able to send messages.'))return;try{await api('POST','/chats/'+cid+'/close',{});await pull()}catch(e){note(box,e.message)}};
 m.append(h('div',{class:'card'},h('div',{style:'display:flex;gap:10px;align-items:center;margin-bottom:10px'},h('b',{style:'margin-right:auto'},'Chat'),status,closeB),log,comp,box));
 pull().catch(e=>note(box,e.message));pollT=setInterval(()=>pull().catch(()=>{}),4000)}
